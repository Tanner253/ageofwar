		<script>
(function() {
	var masterGain = null;
	var savedVolume = parseFloat(localStorage.getItem('aow_volume'));
	if (isNaN(savedVolume)) savedVolume = 1;
	var muted = false;

	var OrigAudioContext = window.AudioContext || window.webkitAudioContext;
	function PatchedAudioContext() {
		var ctx = new OrigAudioContext();
		if (!masterGain) {
			masterGain = ctx.createGain();
			masterGain.gain.value = savedVolume;
			masterGain.connect(ctx.destination);
			window._aowGain = masterGain;
			applySlider();
		}
		return ctx;
	}
	if (OrigAudioContext) {
		window.AudioContext = PatchedAudioContext;
		if (window.webkitAudioContext) window.webkitAudioContext = PatchedAudioContext;
	}

	var origConnect = AudioNode.prototype.connect;
	AudioNode.prototype.connect = function(dest) {
		if (dest instanceof AudioDestinationNode && masterGain && this !== masterGain) {
			return origConnect.call(this, masterGain);
		}
		return origConnect.apply(this, arguments);
	};

	function applySlider() {
		var slider = document.getElementById('vol-slider');
		var btn = document.getElementById('vol-btn');
		if (slider) slider.value = Math.round(savedVolume * 100);
		if (btn) btn.innerHTML = savedVolume <= 0 ? '&#128263;' : '&#128266;';
	}

	window.aowSetVolume = function(v) {
		savedVolume = Math.max(0, Math.min(1, v));
		localStorage.setItem('aow_volume', savedVolume);
		if (masterGain) masterGain.gain.value = savedVolume;
		var btn = document.getElementById('vol-btn');
		if (btn) btn.innerHTML = savedVolume <= 0 ? '&#128263;' : '&#128266;';
	};

	document.addEventListener('DOMContentLoaded', function() {
		var slider = document.getElementById('vol-slider');
		var btn = document.getElementById('vol-btn');
		applySlider();

		slider.addEventListener('input', function() {
			muted = false;
			window.aowSetVolume(parseInt(slider.value) / 100);
		});

		var preMuteVolume = savedVolume;
		btn.addEventListener('click', function() {
			if (muted) {
				muted = false;
				var restore = preMuteVolume > 0 ? preMuteVolume : 1;
				window.aowSetVolume(restore);
				slider.value = Math.round(restore * 100);
			} else {
				preMuteVolume = savedVolume;
				muted = true;
				if (masterGain) masterGain.gain.value = 0;
				btn.innerHTML = '&#128263;';
			}
		});

		slider.addEventListener('mousedown', function(e) { e.stopPropagation(); });
		slider.addEventListener('touchstart', function(e) { e.stopPropagation(); });
	});
})();
		</script>

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"age-of-war","experimentalVK":false,"fileSizes":{"age-of-war.pck":71845292,"age-of-war.wasm":35739700},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			window._godotReady = true;
		}, displayFailureNotice);
	}
}());

		<script>
(function() {
	const params = new URLSearchParams(window.location.search);
	const serverParam = params.get("server");
	const playerName = params.get("name") || localStorage.getItem("aow_name") || "Anonymous";

	let wsUrl;
	if (serverParam) {
		wsUrl = serverParam;
	} else if (window.GAME_CONFIG && window.GAME_CONFIG.WS_URL) {
		wsUrl = window.GAME_CONFIG.WS_URL;
	} else {
		const proto = location.protocol === "https:" ? "wss://" : "ws://";
		wsUrl = proto + location.host;
	}

	let chatWs = null;
	let collapsed = false;
	let unreadCount = 0;

	const urlParams = new URLSearchParams(window.location.search);
	const lobbyId = urlParams.get("lobby");
	const role = urlParams.get("role") || "player";
	const woOverlay = document.getElementById("waiting-overlay");
	const woArena = document.getElementById("woArena");
	const woSub = document.getElementById("woSub");

	if (lobbyId) {
		woArena.textContent = lobbyId.replace("_", " ");
	}
	if (role === "spectator") {
		document.querySelector(".wo-status").textContent = "Joining as spectator...";
		woSub.textContent = "Loading the battle";
	}

	function hideWaitingOverlay() {
		if (!woOverlay || woOverlay.classList.contains("hidden")) return;
		woOverlay.classList.add("fade-out");
		setTimeout(function() { woOverlay.classList.add("hidden"); }, 600);
	}
	window.hideWaitingOverlay = hideWaitingOverlay;

	function chatConnect() {
		chatWs = new WebSocket(wsUrl);
		chatWs.onopen = function() {
			chatWs.send(JSON.stringify({ type: "set_name", name: playerName }));
		};
		chatWs.onmessage = function(e) {
			const msg = JSON.parse(e.data);
			if (msg.type === "chat") appendMsg(msg);
			else if (msg.type === "chat_history" && msg.messages) {
				for (const m of msg.messages) appendMsg(m, false);
				scrollChat();
			}
			else if (msg.type === "game_start") {
				hideWaitingOverlay();
			}
			else if (msg.type === "lobby_list" && msg.lobbies && lobbyId) {
				const lobby = msg.lobbies.find(function(l) { return l.id === lobbyId; });
				if (lobby && lobby.status === "playing") {
					hideWaitingOverlay();
				}
			}
		};
		chatWs.onclose = function() { setTimeout(chatConnect, 4000); };
		chatWs.onerror = function() {};
	}

	function appendMsg(msg, scroll) {
		const el = document.getElementById("chat-messages-game");
		const d = document.createElement("div");
		d.className = "cm" + (msg.system ? " sys" : "");
		if (msg.system) {
			d.textContent = msg.message;
		} else {
			const n = document.createElement("span");
			n.className = "cn";
			n.textContent = msg.name + ": ";
			d.appendChild(n);
			d.appendChild(document.createTextNode(msg.message));
		}
		el.appendChild(d);
		if (el.children.length > 150) el.removeChild(el.firstChild);
		if (scroll !== false) scrollChat();
		if (collapsed) {
			unreadCount++;
			const badge = document.getElementById("chat-unread");
			badge.textContent = unreadCount;
			badge.style.display = "inline";
		}
	}

	function scrollChat() {
		const el = document.getElementById("chat-messages-game");
		el.scrollTop = el.scrollHeight;
	}

	window.gameSendChat = function() {
		const input = document.getElementById("gameChatInput");
		const text = input.value.trim();
		if (!text || !chatWs || chatWs.readyState !== WebSocket.OPEN) return;
		chatWs.send(JSON.stringify({ type: "chat", message: text }));
		input.value = "";
	};

	window.toggleChat = function() {
		collapsed = !collapsed;
		document.getElementById("chat-overlay").classList.toggle("collapsed", collapsed);
		document.getElementById("chat-toggle-icon").innerHTML = collapsed ? "&#9650;" : "&#9660;";
		if (!collapsed) {
			unreadCount = 0;
			document.getElementById("chat-unread").style.display = "none";
			scrollChat();
		}
	};

	document.getElementById("gameChatInput").addEventListener("keydown", function(e) {
		if (e.key === "Enter") gameSendChat();
		e.stopPropagation();
	});

	document.getElementById("gameChatInput").addEventListener("keyup", function(e) { e.stopPropagation(); });
	document.getElementById("gameChatInput").addEventListener("keypress", function(e) { e.stopPropagation(); });

	if (role !== "spectator") {
		var surrenderShown = false;
		var origOnMessage = null;
		function showSurrenderWhenGameStarts(e) {
			var msg = JSON.parse(e.data);
			if (msg.type === "game_start") {
				document.getElementById("surrender-btn").style.display = "block";
				surrenderShown = true;
			}
			if (msg.type === "game_over") {
				document.getElementById("surrender-btn").style.display = "none";
			}
		}
		var origChatOnMsg = null;
		var checkInterval = setInterval(function() {
			if (chatWs && chatWs.onmessage) {
				var prevHandler = chatWs.onmessage;
				chatWs.onmessage = function(e) {
					prevHandler(e);
					showSurrenderWhenGameStarts(e);
				};
				clearInterval(checkInterval);
			}
		}, 200);
	}

	window.confirmSurrender = function() {
		if (!confirm("Are you sure you want to surrender? This counts as a loss.")) return;
		window._aowSurrender = true;
		document.getElementById("surrender-btn").style.display = "none";
	};

	chatConnect();
})();
